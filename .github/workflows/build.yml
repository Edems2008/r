name: Build Nova

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Forge mod (Nova Companion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true   # a ForgeGradle gyorsítótára félkész állapotban hibát okozhat
      - name: Build
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: novacompanion-mod
          path: mod/build/libs/novacompanion-*.jar

  android:
    name: Android app (Nova Companion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../NovaCompanion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: NovaCompanion.apk

  launcher:
    name: Launcher (${{ matrix.os }})
    needs: mod
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Nova Companion mod a csomagba
        uses: actions/download-artifact@v4
        with:
          name: novacompanion-mod
          path: launcher/build-resources/mods
      - name: Build azonosító
        working-directory: launcher
        shell: bash
        run: echo "{\"commit\":\"${GITHUB_SHA}\"}" > build-info.json
      - name: Install
        working-directory: launcher
        run: npm ci
      - name: Check
        working-directory: launcher
        run: npm run check
      - name: Modok letöltése a telepítőbe (Modrinth)
        working-directory: launcher
        run: npm run fetch-mods
      - name: Build installer
        working-directory: launcher
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: |
            launcher/dist/*.exe
            launcher/dist/*.AppImage

  release:
    name: GitHub Release
    # verzió-tagre, vagy a fejlesztői ágra érkező frissítésre: letöltőoldal (Release) a legfrissebb buildekkel
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/claude/minecraft-custom-launcher-e90gxa'
    needs: [mod, android, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Fájlok listája
        run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nova-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Nova Launcher – legfrissebb' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## Letöltés
            - **Windows launcher:** `Nova.Launcher.Setup.*.exe` (telepítő) vagy a másik `.exe` (hordozható, telepítés nélkül)
            - **Android app:** `NovaCompanion.apk`
            - Linux: `.AppImage` • Csak a mod: `novacompanion-*.jar`

            Windows figyelmeztetésnél: *További információ → Futtatás mindenképp*.
          files: out/**
